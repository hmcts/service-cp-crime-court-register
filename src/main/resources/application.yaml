spring:
  application:
    name: service-cp-crime-court-register

  # The processed-log store. Every value here is a LOCAL development default matching the `postgres`
  # service in docker-compose.yml; deployed environments override them from Key Vault through the
  # Secrets Store CSI driver, which reaches these keys by the usual relaxed-binding environment
  # variables (SPRING_DATASOURCE_URL and friends).
  datasource:
    url: jdbc:postgresql://localhost:5432/courtregister
    username: courtregister
    password: courtregister
    hikari:
      # Lazy pool initialisation: no connection is opened during context refresh, so the application
      # starts even with the store down. It has to — actuator must be up to report readiness DOWN
      # honestly, and a pod that cannot start cannot tell anyone why (research §7).
      initialization-fail-timeout: -1
      data-source-properties:
        # A store that dies without closing its connections would otherwise block the health probe
        # for ever, and intake would never suspend. Seconds, per the PostgreSQL JDBC driver.
        socketTimeout: 30

  flyway:
    # The Flyway bean is configured here; when the migration runs is a separate decision. The
    # lifecycle controller takes it off the context-refresh path and runs it on the first successful
    # store probe, before intake starts, so no message is ever consumed against an unmigrated schema.
    enabled: true

server:
  port: ${SERVER_PORT:8082}

courtregister:
  consumer:
    # The master switch for intake. Off in the `test` profile, so context-load tests need no broker.
    enabled: true

  servicebus:
    # LOCAL AND CI ONLY — the Service Bus emulator's well-known development string, which is why it
    # ends UseDevelopmentEmulator=true. A deployed environment sets `namespace` instead and clears
    # this; exactly one of the two may be set, and startup fails fast otherwise.
    connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    # namespace: set in deployed environments only, for workload identity.
    queue-name: courtregister.requests
    # Two concurrent deliveries, matching the Durable Functions throttle this service replaces.
    max-concurrent-calls: 2
    # Mirrors the broker queue's own setting. Used to recognise the final permitted delivery, so it
    # must be changed here and on the queue together.
    max-delivery-count: 5
    # Must be at least the processing deadline plus the fixed 30s renewal margin, so the broker lock
    # always outlives a legitimate run. Validated at startup.
    max-auto-lock-renew-duration: 5m
    # An unresolved connection error older than this, with no traffic since, stops being reported as
    # an outage: an idle queue produces no traffic, and absence of traffic is not a failure.
    health-staleness: 60s

  claim:
    # How long an acquired claim stays live, written as now() + lease by the database.
    lease: 5m
    # The enforced bound on a run. Strictly shorter than the lease, so a slow runner stops itself
    # before its claim can be reclaimed. Validated at startup.
    processing-deadline: 4m

  store:
    # How often the store is probed, driving the gated start and the resume after an outage.
    probe-interval: 10s

  progression:
    # The progression context — the command API this register is POSTed to
    # (progression.add-court-register). This is the SUBMISSION namespace; the results context below
    # is only the payload-query fallback. LOCAL DEFAULT ONLY, and not a value chosen here: it is the
    # baseUri the Progression command API's own RAML declares. Deployed environments set
    # PROGRESSION_BASE_URL to the internal mesh host.
    base-url: ${PROGRESSION_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity. A secret: it arrives from Key Vault through the Secrets Store CSI
    # driver, so what is written here is the binding and never a value — the empty default leaves a
    # local run with no identity to borrow.
    # It is REQUIRED in LIVE mode. The command is refused without it, so the service refuses to
    # start without it rather than dead-letter every hearing it is given, one 403 at a time. Named
    # here rather than left to relaxed binding: a variable a comment documents and no key reads is
    # a deployment that sets it correctly and still fails to start.
    system-user-id: ${COURT_REGISTER_SYSTEM_USER_ID:}
    # Retry policy for the POST (defect fixes C1/C3). Connect and read failures, 5xx, 429 AND 408
    # are retried with exponential back-off; any other 4xx is a refusal and is never retried; a
    # Retry-After header is honoured in delta-seconds only and bounded by max-backoff (an HTTP-date
    # value is classified, never parsed). Success is 202 and nothing else. The numbers are this
    # service's own: the contract documents that back-off happens, not how much of it, so they are
    # configuration rather than constants.
    max-attempts: 4
    initial-backoff: 500ms
    # The ceiling on any wait, a server-supplied Retry-After included. Worst case must stay well
    # inside courtregister.claim.processing-deadline, or a run would still be waiting when its
    # claim is reclaimed.
    max-backoff: 20s
    connect-timeout: 5s
    read-timeout: 30s
    # headers: an optional map of extra static headers for the POST, bound but empty by default.

  submission:
    # Pre-send contract validation (defect fix C29): every outbound document is validated against
    # the vendored progression schemas (classpath:contracts/progression/) before the POST; a
    # schema-invalid document is an explicit FAILED with a reason, never a swallowed 400. Never
    # disabled in a deployed profile — startup refuses false wherever the deployed credential
    # source (servicebus.namespace) is in use.
    validate-outbound: true

  results:
    # The results context QUERY API — the payload fallback the cache misses to
    # (hearingDetails/internal). Fallback ONLY: the register is not POSTed here (that is
    # courtregister.progression above). LOCAL DEFAULT ONLY; deployed environments set
    # RESULTS_BASE_URL to the internal mesh host.
    base-url: ${RESULTS_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity for the fallback query, same sourcing rules as progression's. REQUIRED
    # in LIVE payload mode: an anonymous query is refused every time.
    system-user-id: ${COURT_REGISTER_SYSTEM_USER_ID:}

  referencedata:
    # LIVE | STUB. LIVE is the reference-data query-API adapter and is what an environment that says
    # nothing gets: a service that has to be told where its register's recipients come from is a
    # service that will one day be deployed not asking. STUB is the refusing stub, for local runs and
    # for the container suites whose subject is settlement and the processed log rather than the
    # register's recipients; startup refuses it wherever the deployed credential source
    # (servicebus.namespace) is in use, because a pod that can never address a register parks every
    # hearing carrying one.
    mode: LIVE
    # LOCAL DEFAULT ONLY, and not a value chosen here: it is the baseUri the reference-data query
    # API's own RAML declares. Deployed environments set REFERENCEDATA_BASE_URL to the internal mesh
    # host. Its own key rather than a member of results.*, because it is a different deployment
    # behind a different host.
    base-url: ${REFERENCEDATA_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity, a secret from Key Vault via the Secrets Store CSI driver. It falls back
    # to this service's own identity because the function app threads a single `cjscppuid` through
    # both calls (ReferenceDataService.js:44), so an environment that mounts one identity is not
    # asked for a second; REFERENCEDATA_SYSTEM_USER_ID exists for the day reference data authorises
    # a different one. REQUIRED in LIVE mode: an anonymous query is refused every time, so the
    # service refuses to start rather than park every hearing that produced a register.
    system-user-id: ${REFERENCEDATA_SYSTEM_USER_ID:${COURT_REGISTER_SYSTEM_USER_ID:}}
    # Attempt count and interval carried from the function app's DEFAULT_PUBLISH_RETRY_COUNT and
    # DEFAULT_PUBLISH_RETRY_INTERVAL (AxiosRetryWrapper.js:10-11) — but the retry TAXONOMY is the
    # corrected one (defect fix C3), applied to every named client: connect/IO failures, 5xx, 429
    # and 408 retry; any other 4xx never does. The legacy wrapper's inverted policy (every status
    # at or below 429 non-retryable) is a catalogued defect, not a behaviour to keep.
    max-attempts: 3
    retry-interval: 1s
    connect-timeout: 5s
    # Shorter than the processing deadline on purpose, for the reason the payload read's is: a read
    # that outlives the deadline outlives the claim behind it.
    read-timeout: 30s

  stub:
    # NONE | TRANSIENT. Test and local profiles only: it is deliberately not a field in the message
    # and not an HTTP endpoint, either of which would be a production fault-injection surface.
    payload-failure-mode: NONE

  payload:
    # LIVE | STUB. LIVE is the cache-with-query-fallback adapter and is what an environment that
    # says nothing gets: a service that has to be told to fetch payloads is a service that will one
    # day be deployed not fetching them. It requires courtregister.results.system-user-id,
    # without which
    # its fallback cannot authorise. STUB is for local runs and for the container suites whose
    # subject is settlement and the processed log rather than the payload; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use.
    mode: LIVE
    redis:
      # LOCAL development defaults, matching the datasource above. Deployed environments override
      # the address and mount the key from Key Vault through the Secrets Store CSI driver.
      host: localhost
      port: 6379
      # password: deployed only, from Key Vault. Never committed.
      # TLS is off for a developer's local server and on everywhere it is deployed — with
      # certificates verified, which the function app disables (registered deviation 1).
      ssl: false
      # The prefix the producer writes the payload under. INT_ is this flow's; SJP hearings stay in
      # the NOWs function app and are out of scope.
      key-prefix: INT_
      connect-timeout: 5s
      command-timeout: 5s
    fallback:
      # Attempt count and interval carried from the function app's defaults; the retry taxonomy is
      # the corrected C3 one (connect/IO, 5xx, 429, 408 retry; other 4xx never), same as every
      # named client in this file.
      max-attempts: 3
      retry-interval: 1s
      connect-timeout: 5s
      # Shorter than the processing deadline on purpose: a read that outlives the deadline outlives
      # the claim behind it, and then two runners believe they own the same request.
      read-timeout: 30s

# Application Insights is configured by the Java agent (lib/applicationinsights.json).
# The per-environment connection string is supplied as APPLICATIONINSIGHTS_CONNECTION_STRING,
# mounted from Key Vault via the Secrets Store CSI driver; there is nothing to set here.

management:
  endpoints:
    web:
      base-path: /actuator
      # The whole HTTP surface of this service. There is no business API (spec FR-014).
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
      group:
        readiness:
          # The store gates readiness, because processing is unsafe without it — and so does this
          # pod's own gated start, because a database that replies is not the same thing as a
          # service in a position to use it. Between them sits the deferred migration and the
          # processor, either of which can fail: a pod whose migration is throwing would otherwise
          # report ready, be sent traffic, count as a healthy replica in a rolling deployment, and
          # consume nothing while the queue grew.
          #
          # The `servicebus` indicator is deliberately absent from both: a broker blip must never
          # roll the pods, and the service cannot heal the queue by restarting (spec FR-011).
          include: db,intakeStartup

logging:
  level:
    root: INFO
