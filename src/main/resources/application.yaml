spring:
  application:
    name: service-cp-crime-court-register

  # The processed-log store. Every value here is a LOCAL development default matching the `postgres`
  # service in docker-compose.yml; deployed environments override them from Key Vault through the
  # Secrets Store CSI driver, which reaches these keys by the usual relaxed-binding environment
  # variables (SPRING_DATASOURCE_URL and friends).
  datasource:
    url: jdbc:postgresql://localhost:5432/courtregister
    username: courtregister
    password: courtregister
    hikari:
      # Lazy pool initialisation: no connection is opened during context refresh, so the application
      # starts even with the store down. It has to — actuator must be up to report readiness DOWN
      # honestly, and a pod that cannot start cannot tell anyone why (research §7).
      initialization-fail-timeout: -1
      data-source-properties:
        # A store that dies without closing its connections would otherwise block the health probe
        # for ever, and intake would never suspend. Seconds, per the PostgreSQL JDBC driver.
        socketTimeout: 30

  flyway:
    # The Flyway bean is configured here; when the migration runs is a separate decision. The
    # lifecycle controller takes it off the context-refresh path and runs it on the first successful
    # store probe, before intake starts, so no message is ever consumed against an unmigrated schema.
    enabled: true

  # The Artemis connection behind the `public.event` subscription (the systemdocgenerator completion
  # events). Every value is a binding, never a value chosen here: the broker URL and credentials
  # arrive from Key Vault through the Secrets Store CSI driver, and the empty defaults leave a local
  # run with nothing to connect to unless docker-compose's `artemis` is pointed at explicitly.
  # The broker NEVER gates readiness (constitution): a blip must not roll the pods.
  artemis:
    broker-url: ${ARTEMIS_BROKER_URL:}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}

  jms:
    # `public.event` is a TOPIC, so the listener container has to be told so; a queue-shaped
    # container would silently receive nothing from a multicast address.
    pub-sub-domain: true
    # A DURABLE subscription, so events published while this service is down or redeploying are
    # still delivered afterwards. A batch's completion arrives exactly once and there is no second
    # chance to hear it; the reconciler is the safety net, not the transport.
    subscription-durable: true
    # The client id the durable subscription is registered under. It is part of the subscription's
    # identity on the broker: changing it abandons the existing subscription (and its backlog) and
    # creates a new one, so it must be changed on the broker and here together.
    client-id: courtregister-service

server:
  port: ${SERVER_PORT:8082}

courtregister:
  # record | progression-post. `record` writes the register into this service's own store and is what
  # an environment that says nothing gets. `progression-post` is the 001 behaviour - POST to the
  # progression command API - kept only as a fallback sequencing option while progression's leg is
  # still deployed. It is a BUILD-TIME fallback, not the cutover switch: the one lever that decides
  # which implementation generates is the App Configuration flag `CourtRegisterService`
  # (constitution Principle III), and nothing here may become a second one.
  output: record

  consumer:
    # The master switch for intake. Off in the `test` profile, so context-load tests need no broker.
    enabled: true

  servicebus:
    # LOCAL AND CI ONLY — the Service Bus emulator's well-known development string, which is why it
    # ends UseDevelopmentEmulator=true. A deployed environment sets `namespace` instead and clears
    # this; exactly one of the two may be set, and startup fails fast otherwise.
    connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    # namespace: set in deployed environments only, for workload identity.
    queue-name: courtregister.requests
    # Two concurrent deliveries, matching the Durable Functions throttle this service replaces.
    max-concurrent-calls: 2
    # Mirrors the broker queue's own setting. Used to recognise the final permitted delivery, so it
    # must be changed here and on the queue together.
    max-delivery-count: 5
    # Must be at least the processing deadline plus the fixed 30s renewal margin, so the broker lock
    # always outlives a legitimate run. Validated at startup.
    max-auto-lock-renew-duration: 5m
    # An unresolved connection error older than this, with no traffic since, stops being reported as
    # an outage: an idle queue produces no traffic, and absence of traffic is not a failure.
    health-staleness: 60s

  claim:
    # How long an acquired claim stays live, written as now() + lease by the database.
    lease: 5m
    # The enforced bound on a run. Strictly shorter than the lease, so a slow runner stops itself
    # before its claim can be reclaimed. Validated at startup.
    processing-deadline: 4m

  store:
    # How often the store is probed, driving the gated start and the resume after an outage.
    probe-interval: 10s

  progression:
    # The progression context — the command API this register is POSTed to
    # (progression.add-court-register). This is the SUBMISSION namespace; the results context below
    # is only the payload-query fallback. LOCAL DEFAULT ONLY, and not a value chosen here: it is the
    # baseUri the Progression command API's own RAML declares. Deployed environments set
    # PROGRESSION_BASE_URL to the internal mesh host.
    base-url: ${PROGRESSION_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity. A secret: it arrives from Key Vault through the Secrets Store CSI
    # driver, so what is written here is the binding and never a value — the empty default leaves a
    # local run with no identity to borrow.
    # It is REQUIRED in LIVE mode. The command is refused without it, so the service refuses to
    # start without it rather than dead-letter every hearing it is given, one 403 at a time. Named
    # here rather than left to relaxed binding: a variable a comment documents and no key reads is
    # a deployment that sets it correctly and still fails to start.
    system-user-id: ${COURT_REGISTER_SYSTEM_USER_ID:}
    # Retry policy for the POST (defect fixes C1/C3), and the SAME three keys the payload fallback
    # and the reference-data read carry: one RetryPolicy object serves all three clients, so
    # max-attempts / initial-backoff / max-backoff mean the same thing wherever they appear.
    # Connect and read failures, 5xx, 429 AND 408 are retried with exponential back-off; any other
    # 4xx is a refusal and is never retried; a Retry-After header is honoured on EVERY retryable
    # answer, in delta-seconds only and bounded by max-backoff (an HTTP-date value is classified,
    # never parsed). Success is 202 and nothing else. The numbers are this service's own: the
    # contract documents that back-off happens, not how much of it, so they are configuration
    # rather than constants.
    max-attempts: 4
    initial-backoff: 500ms
    # The ceiling on any wait, a server-supplied Retry-After included — and therefore the WORST CASE
    # for every wait, since a remote service may ask for the ceiling on every attempt. Startup
    # budgets it that way: three waits of 5s plus four attempts of 5s + 10s is 75s of the
    # four-minute deadline.
    max-backoff: 5s
    connect-timeout: 5s
    # Bounded so the whole run fits: the payload fetch, the now-subscriptions read and this
    # submission are spent inside ONE claim, and startup refuses a set of timeouts whose sum plus a
    # fixed 30s margin for the guard's writes and the transformation reaches
    # courtregister.claim.processing-deadline.
    read-timeout: 10s
    # headers: an optional map of extra static headers for the POST, bound but empty by default.

  submission:
    # Pre-send contract validation (defect fix C29): every outbound document is validated against
    # the vendored progression schemas (classpath:contracts/progression/) before the POST; a
    # schema-invalid document is an explicit FAILED with a reason, never a swallowed 400.
    # This key is a STARTUP RULE, not a runtime switch: startup refuses false wherever the deployed
    # credential source (servicebus.namespace) is in use, and the validator is wired unconditionally
    # in PipelineConfig, so nothing reads the value on the hot path. A wiring that honoured it would
    # put C29's blind spot back behind one property.
    validate-outbound: true

  results:
    # The results context QUERY API — the payload fallback the cache misses to
    # (hearingDetails/internal). Fallback ONLY: the register is not POSTed here (that is
    # courtregister.progression above). LOCAL DEFAULT ONLY; deployed environments set
    # RESULTS_BASE_URL to the internal mesh host.
    base-url: ${RESULTS_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity for the fallback query, same sourcing rules as progression's. REQUIRED
    # in LIVE payload mode: an anonymous query is refused every time.
    system-user-id: ${COURT_REGISTER_SYSTEM_USER_ID:}

  referencedata:
    # LIVE | STUB. LIVE is the reference-data query-API adapter and is what an environment that says
    # nothing gets: a service that has to be told where its register's recipients come from is a
    # service that will one day be deployed not asking. STUB asks reference data nothing and answers
    # that nobody is subscribed, for local runs and for the container suites whose subject is
    # settlement and the processed log rather than the register's recipients; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use, AND beside a LIVE
    # payload source — real hearings answered that way would every one of them complete
    # no-subscriptions, which is this flow's commonest legitimate outcome and so indistinguishable
    # from working.
    mode: LIVE
    # LOCAL DEFAULT ONLY, and not a value chosen here: it is the baseUri the reference-data query
    # API's own RAML declares. Deployed environments set REFERENCEDATA_BASE_URL to the internal mesh
    # host. Its own key rather than a member of results.*, because it is a different deployment
    # behind a different host.
    base-url: ${REFERENCEDATA_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity, a secret from Key Vault via the Secrets Store CSI driver. It falls back
    # to this service's own identity because the function app threads a single `cjscppuid` through
    # both calls (ReferenceDataService.js:44), so an environment that mounts one identity is not
    # asked for a second; REFERENCEDATA_SYSTEM_USER_ID exists for the day reference data authorises
    # a different one. REQUIRED in LIVE mode: an anonymous query is refused every time, so the
    # service refuses to start rather than park every hearing that produced a register.
    system-user-id: ${REFERENCEDATA_SYSTEM_USER_ID:${COURT_REGISTER_SYSTEM_USER_ID:}}
    # headers: an optional map of further static headers for the read, bound but empty by default —
    # the same key courtregister.progression carries and for the same reason. CJSCPPUID is
    # documented and reference data's authorisation scheme is not: its access-control rules require
    # the caller to be in a named user group, so whatever the mesh turns out to need can be supplied
    # without a code change and nothing is invented here meanwhile. A header configured under a
    # contract name (Accept, CJSCPPUID) REPLACES the contract value rather than joining it — two
    # values of either is a 406 or an ambiguous caller.
    # Attempt count carried from the function app's DEFAULT_PUBLISH_RETRY_COUNT
    # (AxiosRetryWrapper.js:10-11) — but the retry POLICY is the corrected one (defect fix C3) and
    # it is the same object every named client holds: connect/IO failures, 5xx, 429 and 408 retry
    # with exponential back-off bounded by max-backoff, a Retry-After is honoured on every retryable
    # answer, and any other 4xx never retries. The legacy wrapper's inverted policy (every status at
    # or below 429 non-retryable) and its fixed one-second interval are catalogued defects, not
    # behaviours to keep — which is why DEFAULT_PUBLISH_RETRY_INTERVAL has no key here any more.
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 2s
    connect-timeout: 5s
    # Shorter than the processing deadline on purpose, for the reason the payload read's is: a read
    # that outlives the deadline outlives the claim behind it — and shorter again so that this read,
    # the payload fetch and the submission TOGETHER fit inside one run's budget, which is what
    # startup now checks. Three attempts of 5s + 10s with two bounded waits of 2s is 49s.
    read-timeout: 10s

  stub:
    # NONE | TRANSIENT. Test and local profiles only: it is deliberately not a field in the message
    # and not an HTTP endpoint, either of which would be a production fault-injection surface.
    payload-failure-mode: NONE
    # ON | OFF | UNREADABLE, and only what the STUB feature-flag reader answers - it decides nothing
    # wherever generation.flag-mode is LIVE, which is everywhere the service is deployed. ON is the
    # default and is the opposite of the live reader's fail-closed disposition on purpose: the stub
    # has no store to fail against, and an answer of OFF would skip every local run before it began.
    # The other two exist so the skip paths can be exercised deliberately.
    flag-answer: ON

  payload:
    # LIVE | STUB. LIVE is the cache-with-query-fallback adapter and is what an environment that
    # says nothing gets: a service that has to be told to fetch payloads is a service that will one
    # day be deployed not fetching them. It requires courtregister.results.system-user-id,
    # without which
    # its fallback cannot authorise. STUB is for local runs and for the container suites whose
    # subject is settlement and the processed log rather than the payload; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use.
    mode: LIVE
    redis:
      # LOCAL development defaults, matching the datasource above. Deployed environments override
      # the address and mount the key from Key Vault through the Secrets Store CSI driver.
      host: localhost
      port: 6379
      # password: deployed only, from Key Vault. Never committed.
      # TLS is off for a developer's local server and on everywhere it is deployed — with
      # certificates verified, which the function app disables (registered deviation 1).
      ssl: false
      # The prefix the producer writes the payload under. INT_ is this flow's; SJP hearings stay in
      # the NOWs function app and are out of scope.
      key-prefix: INT_
      connect-timeout: 5s
      command-timeout: 5s
    fallback:
      # Attempt count carried from the function app's defaults; the retry POLICY is the corrected C3
      # one and is the same object every named client in this file holds — connect/IO, 5xx, 429 and
      # 408 retry with exponential back-off bounded by max-backoff, a Retry-After is honoured on
      # every retryable answer, and no other 4xx ever retries.
      max-attempts: 3
      initial-backoff: 1s
      max-backoff: 2s
      connect-timeout: 5s
      # Shorter than the processing deadline on purpose: a read that outlives the deadline outlives
      # the claim behind it, and then two runners believe they own the same request. Shorter again so
      # the fetch leaves room for the now-subscriptions read and the submission spent in the same
      # run: 20s of cache reads and three attempts of 5s + 10s with two bounded waits of 2s is 69s
      # of the four-minute budget.
      read-timeout: 10s

  generation:
    # The master switch for the whole downstream half: the nightly job, the public-event listener,
    # the file-service datasource and the validators that guard them. LOCAL DEFAULT ONLY - it is
    # false here so a developer's run and the plain context-load tests need no broker, no second
    # database and no App Configuration; deployed environments set COURTREGISTER_GENERATION_ENABLED
    # to true. Turning it on turns on the startup refusals with it: the file-service datasource, the
    # flag configuration, the SDG/NN endpoints and the e-mail template id all become required.
    enabled: ${COURTREGISTER_GENERATION_ENABLED:false}
    # 18:00, Monday to Friday. Six fields, Spring's cron dialect (second first).
    cron: "0 0 18 * * MON-FRI"
    # The zone the cron above is read in, and the requirement is 18:00 WALL CLOCK in BST and GMT
    # alike. The legacy fires in the scheduling JVM's default zone because its Quartz trigger is
    # built without a time zone; that ambiguity is not inherited. Startup refuses any other value
    # unless zone-override-acknowledged below is true.
    zone: Europe/London
    # An explicit acknowledgement, and the only way to run in another zone. It exists so a zone
    # change is a deliberate, reviewable act rather than a typo that silently moves the run.
    zone-override-acknowledged: false
    # The bound on REQUESTING: how long one run may go on asking systemdocgenerator to render
    # batches. Completion is event-driven, so a slow render never spends this budget and never
    # blocks the next request.
    run-deadline: 60m
    # How long the ShedLock lock over the nightly run is held, and the value the job's
    # @SchedulerLock reads. It is run-deadline plus a fixed ten-minute margin, so a run still inside
    # its hour cannot be joined by the replica that took the lock it had already lost - two
    # documents and two e-mails for every court centre in the country. Lengthening run-deadline
    # without lengthening this is refused at startup rather than discovered at 18:00.
    lock-at-most-for: 70m
    # How long a batch may sit in GENERATING before the reconciler asks systemdocgenerator's query
    # API what happened to it. Past it with no answer, the batch fails GENERATION_TIMED_OUT.
    grace-period: 10m
    # event | poll-only. `event` learns each outcome from the public-event topic and is the platform
    # pattern; the reconciler above is its safety net. `poll-only` is an escape hatch for a broker
    # outage, is logged loudly at every run, and makes the SDG query API this flow's only synchronous
    # coupling. `event` additionally requires the broker configuration above at startup.
    completion: event
    # LIVE | STUB, one per downstream, with the same rule the 001 modes carry: LIVE is what an
    # environment that says nothing gets, and startup refuses STUB wherever the deployed credential
    # source (servicebus.namespace) is in use or generation is enabled. The stubs exist for local
    # runs and for the container suites whose subject is the batch state machine rather than the
    # downstream itself.
    sdg-mode: LIVE
    nn-mode: LIVE
    fileservice-mode: LIVE
    flag-mode: LIVE

  feature:
    # The App Configuration store this service reads the cutover flag from - the THIRD reader of one
    # flag, after the producer and the legacy. The job reads it once per run, with no cache, and
    # fails closed: OFF or unreadable means the run is skipped and counted, never that this service
    # generates anyway. A secret-adjacent binding and never a value: the endpoint arrives from the
    # deployment, and the empty default leaves a local run with no store to read.
    endpoint: ${APPCONFIG_ENDPOINT:}
    # The setting key, in App Configuration's feature-flag form. It is the SAME key the legacy JS
    # client reads, which is what makes the flag one lever rather than three: changing it here
    # without changing it there would leave two implementations disagreeing about the cutover.
    key: .appconfig.featureflag/CourtRegisterService
    # The App Configuration label, which is how one store serves every stack. Empty locally; the
    # deployment supplies its stack's label. A wrong label reads a different stack's flag.
    label: ${STACK_LABEL:}
    # The whole budget for the read, and short on purpose: the flag gates the start of a run, and a
    # store that is slow must not hold the run open. A timeout is UNREADABLE, which is OFF.
    timeout: 2s

  fileservice:
    # The framework file service's own Postgres - one shared database per stack - written to
    # directly, because systemdocgenerator's generate-document takes a payloadFileServiceId and will
    # only render a payload that is already in the file service. This service's use of it is
    # WRITE-ONLY: it inserts the metadata and content rows the framework's own repositories insert
    # and reads nothing back. A separate datasource from spring.datasource above, and one that gates
    # readiness only while a run is in progress. Bindings, never values: the URL and credentials
    # arrive from Key Vault through the Secrets Store CSI driver, and the empty defaults are what
    # make startup refuse when generation is enabled without them.
    url: ${FILESERVICE_DATASOURCE_URL:}
    username: ${FILESERVICE_DATASOURCE_USERNAME:}
    password: ${FILESERVICE_DATASOURCE_PASSWORD:}

  endpoints:
    # The internal mesh hosts of the two downstreams. HOSTS ONLY: each client appends its own
    # contract path (systemdocgenerator's command generate-document and query document/{id};
    # notificationnotify's send-email-notification), so a path written here would be appended to.
    # Empty by default rather than pointed at localhost: an endpoint this service invents is an
    # endpoint a deployment can forget to set and still start. With generation enabled, startup
    # refuses without them.
    systemdocgenerator: ${SYSTEMDOCGENERATOR_BASE_URL:}
    notificationnotify: ${NOTIFICATIONNOTIFY_BASE_URL:}
    # The CJSCPPUID both downstream calls are made under. One identity, because the nightly run is
    # one caller: it asks systemdocgenerator to render a batch and notificationnotify to e-mail it,
    # inside one run. The same service identity the results and reference-data reads already use;
    # empty locally, because a run that has no endpoints to call needs nobody to call them as.
    system-user-id: ${COURT_REGISTER_SYSTEM_USER_ID:}
    # The transport the two clients share, at the estate's own defaults. Both timeouts are set
    # deliberately: a render request with no read timeout can outlive the run deadline that was
    # supposed to bound it, and a night that never returns from one POST is a night that generates
    # nothing behind it.
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 2s
    connect-timeout: 5s
    read-timeout: 10s

  email:
    templates:
      # The notificationnotify template the court-register e-mail is sent with, by UUID. It is
      # REQUIRED in LIVE mode when generation is enabled and validated for shape at startup, not at
      # send time (defect fix P9): a blank or malformed id discovered at 18:00 is a night's registers
      # unsent, whereas a deployment that cannot start is a deployment that gets fixed. A binding,
      # never a value - the id belongs to the environment's notificationnotify configuration.
      cr_standard: ${CR_EMAIL_TEMPLATE_ID:}

  publicevents:
    # The platform's shared public-event topic, and the destination the completion listener
    # subscribes to. Not this service's own topic and not configurable per environment in practice:
    # it is the estate's one multicast address.
    topic: public.event
    # The durable subscription's name on the broker. It, with spring.jms.client-id above, IS the
    # subscription's identity: changing either abandons the existing subscription and its backlog.
    subscription: courtregister-service.sdg
    # The JMS selector, applied by the BROKER, so only the two systemdocgenerator outcome events
    # ever reach this service off a topic the whole estate publishes to. It is the coarse filter
    # only: the listener still keeps just the events whose originatingSource is CourtRegisterService
    # and correlates them to a batch by sourceCorrelationId, which is what keeps progression's
    # still-deployed listener and this one out of each other's documents.
    selector: "CPPNAME IN ('public.systemdocgenerator.events.document-available','public.systemdocgenerator.events.generation-failed')"

# Application Insights is configured by the Java agent (lib/applicationinsights.json).
# The per-environment connection string is supplied as APPLICATIONINSIGHTS_CONNECTION_STRING,
# mounted from Key Vault via the Secrets Store CSI driver; there is nothing to set here.

management:
  endpoints:
    web:
      base-path: /actuator
      # The whole HTTP surface of this service. There is no business API (spec FR-014).
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
      group:
        readiness:
          # The store gates readiness, because processing is unsafe without it — and so does this
          # pod's own gated start, because a database that replies is not the same thing as a
          # service in a position to use it. Between them sits the deferred migration and the
          # processor, either of which can fail: a pod whose migration is throwing would otherwise
          # report ready, be sent traffic, count as a healthy replica in a rolling deployment, and
          # consume nothing while the queue grew.
          #
          # `fileServiceRun` is the third, and it is a narrower claim than the other two make. The
          # file-service datasource is in use for a few seconds a night, so the component gates
          # readiness only while a generation run is actually in progress, when an unreachable
          # payload store is a run about to fail every batch PAYLOAD_STORE_UNAVAILABLE; between runs
          # it answers UP without asking, and says that it did not ask. Naming it here is what lets
          # that decision reach readiness at all, and the component itself is what keeps the group
          # quiet for the other twenty-three hours. It is contributed whether or not generation is
          # enabled, because Spring validates group membership at startup and a name a property had
          # removed would fail the context.
          #
          # The two broker indicators, `servicebus` and `publicEvents`, are deliberately absent: a
          # blip must never roll the pods, and the service cannot heal a broker by restarting
          # (spec FR-011). Both are reported as their own components, outside every group.
          include: db,intakeStartup,fileServiceRun
  health:
    jms:
      # Spring Boot auto-configures a `jms` health indicator as soon as a ConnectionFactory is on the
      # context, and it goes DOWN whenever the broker is quiet or briefly unreachable. That indicator
      # is part of the health aggregate, so leaving it on would let broker silence turn the whole
      # service DOWN - the exact behaviour spec FR-011 forbids, for the same reason `servicebus` is
      # kept out of the readiness group above.
      #
      # The broker is still reported, just not by this: `PublicEventsHealthIndicator` reports the
      # `public.event` subscription's own state and the age of its last delivery as its own
      # component, outside readiness, so an operator can see the broker state without a blip rolling
      # the pods - and silence on a running subscription is published as an age rather than called
      # an outage, which is exactly the judgement the auto-configured indicator would make wrongly.
      enabled: false

logging:
  # INFO, and nothing below it anywhere in this file. The privacy rules (constitution Principle VII)
  # are asserted against the code, but the level a pod runs at is what decides how much of the code
  # gets to speak: a shipped DEBUG level for one package is how a payload dump written for a local
  # diagnosis reaches the estate's log index. TelemetryPrivacyTest reads this file and fails on a
  # DEBUG or TRACE level appearing here.
  #
  # Format is not configurable and is not set here: logback.xml emits JSON unconditionally, with the
  # MDC provider that puts requestId and hearingId on every line.
  level:
    root: INFO
